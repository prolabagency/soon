<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>PROlab Agency — Создаём сайты, приложения и автоматизируем бизнес</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO -->
    <meta name="description" content="Создаём сайты, мобильные приложения и автоматизируем бизнес. Пока этот сайт обновляется, переходите на PROlab Agency." />
    <meta name="keywords" content="PROlab Agency, разработка сайтов, мобильные приложения, CRM, автоматизация, Ош, Бишкек, веб-студия" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="PROlab Agency" />
    <meta property="og:title" content="PROlab Agency — Digital-решения для вашего бизнеса" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prolabagency.com" />
    <meta property="og:description" content="Создаём сайты, приложения и автоматизируем бизнес. Пока этот сайт обновляется, переходите на PROlab Agency." />
    <meta property="og:image" content="https://prolabagency.com/images/logo.png" />

    <!-- Hreflang -->
    <link rel="alternate" href="https://prolabagency.com/ru" hreflang="ru" />
    <link rel="alternate" href="https://prolabagency.com/en" hreflang="en" />
    <link rel="alternate" href="https://prolabagency.com" hreflang="kg" />

    <!-- Styles (embedded to avoid missing files) -->
    <style>
      :root {
        --bg-1: #0b1220;
        --bg-2: #111827;
        --accent: #006eff;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --card: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.10);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 800px at 10% 10%, #1e3a8a 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 20%, #14b8a6 0%, transparent 55%),
          radial-gradient(1100px 700px at 30% 90%, #7c3aed 0%, transparent 60%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        background-size: 200% 200%;
        animation: bgShift 20s ease-in-out infinite;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @keyframes bgShift {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
      }
      .page { min-height: 100dvh; display: flex; flex-direction: column; }
      .brand { padding: 24px; text-align: center; opacity: .95; }
      .logo { margin: 0; font-weight: 800; letter-spacing: .4px; font-size: clamp(18px, 2.4vw, 22px); }
      .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
      .heading { margin: 0; font-size: clamp(28px, 5vw, 48px); line-height: 1.08; letter-spacing: -.2px; }
      .subtitle { margin: 0; max-width: 820px; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.5; color: var(--muted); }
      .cta {
        display: inline-block; margin-top: 6px; padding: 14px 22px; border-radius: 12px;
        background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .2px; font-size: 16px;
        box-shadow: 0 10px 24px rgba(0,0,0,.25); transition: transform .15s ease, box-shadow .15s ease, background .2s ease; outline: none;
      }
      .cta:hover, .cta:focus { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(0,0,0,.30); }
      .cta:active { transform: translateY(0); box-shadow: 0 8px 18px rgba(0,0,0,.20); }
      .features {
        width: 100%; max-width: 920px; margin: 16px auto 0; padding: 0; list-style: none;
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;
      }
      .feature {
        display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--card-border);
        padding: 12px 14px; border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-align: left;
      }
      .feature svg { width: 20px; height: 20px; flex: 0 0 20px; color: #ffffff; opacity: .9; }
      .footer { text-align: center; padding: 22px; color: var(--muted); font-size: 14px; }
      @media (max-width: 900px) { .features { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { body { animation: none; } .cta { transition: none; } }
    </style>

    <script>
      // Локализация контента
      const messages = {
        ru: {
          lang: "ru",
          title: "PROlab Agency",
          heading: "Диджитал-решения, которые двигают бизнес",
          subtitle: "Пока этот сайт обновляется, загляните на PROlab Agency — создаём сайты, мобильные приложения и автоматизируем бизнес.",
          cta: "Перейти на PROlab Agency",
          keywords: "PROlab Agency, разработка сайтов, мобильные приложения, CRM, автоматизация, Ош, Бишкек, веб-студия",
          features: ["Сайты «под ключ»", "Мобильные приложения", "CRM и автоматизация"],
        },
        en: {
          lang: "en",
          title: "PROlab Agency",
          heading: "Digital solutions that grow your business",
          subtitle: "While this site is being updated, visit PROlab Agency — we build websites, mobile apps, and automate businesses.",
          cta: "Visit PROlab Agency",
          keywords: "PROlab Agency, web development, mobile apps, CRM, automation, Osh, Bishkek, web studio",
          features: ["Websites", "Mobile apps", "CRM & automation"],
        },
        kg: {
          lang: "kg",
          title: "PROlab Agency",
          heading: "Бизнесиңизди алдыга жылдырган санарип чечимдер",
          subtitle: "Бул сайт жаңыртылып жатат, PROlab Agency сайтына өтүңүз — биз сайттарды, мобилдик тиркемелерди жасайбыз жана бизнес автоматташтырабыз.",
          cta: "PROlab Agency сайтына өтүү",
          keywords: "PROlab Agency, сайт иштеп чыгуу, мобилдик тиркемелер, CRM, автоматташтыруу, Ош, Бишкек, веб-студия",
          features: ["Даяр сайттар", "Мобилдик тиркемелер", "CRM жана автоматташтыруу"],
        },
      };

      function setLanguage() {
        const userLang = (navigator.language || navigator.userLanguage || "ru").toLowerCase();
        const lang = userLang.includes("kg") ? "kg" : userLang.includes("ru") ? "ru" : "en";

        // SEO и lang
        document.documentElement.lang = messages[lang].lang;
        document.title = messages[lang].title + " — " + messages[lang].heading;
        document.querySelector('meta[name="description"]').setAttribute("content", messages[lang].subtitle);
        document.querySelector('meta[name="keywords"]').setAttribute("content", messages[lang].keywords);
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute("content", messages[lang].subtitle);

        // Контент
        document.getElementById("site-title").textContent = messages[lang].title;
        document.getElementById("heading").textContent = messages[lang].heading;
        document.getElementById("subtitle").textContent = messages[lang].subtitle;

        // CTA
        const currentDomain = window.location.hostname;
        const prolabLink = document.getElementById("prolab-link");
        prolabLink.textContent = messages[lang].cta;
        prolabLink.href = `https://prolabagency.com?referrer=${currentDomain}`;

        // Features
        const f = messages[lang].features;
        document.getElementById("f1").textContent = f[0];
        document.getElementById("f2").textContent = f[1];
        document.getElementById("f3").textContent = f[2];
      }

      window.addEventListener("DOMContentLoaded", setLanguage);
    </script>
  </head>

  <body class="landing">
    <div class="page">
      <header class="brand">
        <div class="logo-box istext" rel="home">
          <h1 class="site-title logo" id="site-title">PROlab Agency</h1>
        </div>
      </header>

      <main class="hero" role="main">
        <h2 class="heading" id="heading">Диджитал-решения, которые двигают бизнес</h2>
        <p class="subtitle" id="subtitle">
          Пока этот сайт обновляется, загляните на PROlab Agency — создаём сайты, мобильные приложения и автоматизируем бизнес.
        </p>

        <a
          id="prolab-link"
          class="cta"
          href="https://prolabagency.com"
          target="_blank" rel="noopener"
          aria-label="Перейти на сайт PROlab Agency"
        >Перейти на PROlab Agency</a>

        <ul class="features" aria-label="Что мы делаем">
          <li class="feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12l4 4 12-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="f1">Сайты «под ключ»</span>
          </li>
          <li class="feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" fill="currentColor"/>
            </svg>
            <span id="f2">Мобильные приложения</span>
          </li>
          <li class="feature">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12h7v8H3zM14 4h7v16h-7z" fill="currentColor"/>
            </svg>
            <span id="f3">CRM и автоматизация</span>
          </li>
        </ul>
      </main>

      <footer class="footer">
        © PROlab <script>document.write(new Date().getFullYear())</script>
      </footer>
    </div>
  </body>
</html>
